name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  page:
    name: 페이지 기본 조건
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 홈페이지 기본 조건 확인
        run: |
          set -eu
          if [ ! -f index.html ]; then
            echo "index.html 이 아직 없습니다. 홈페이지 풀 리퀘스트 전에는 통과합니다."
            exit 0
          fi
          grep -q 'lang="ko"' index.html
          grep -q 'id="main"' index.html
          grep -q 'name="description"' index.html
          grep -q 'class="skip-link"' index.html
          grep -q 'prefers-reduced-motion' styles.css
          echo "페이지 기본 조건을 확인했습니다."
